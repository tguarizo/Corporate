name: Coonto brochure target audit
on:
  push:
    branches: [feature/jornada-multimidia]
    paths: [.github/workflows/coonto-brochure-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify SSH configuration and audited host identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing SSH_PRIVATE_KEY'; exit 1; }
          test -n "$SERVER_HOST" || { echo 'Missing SERVER_HOST'; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 20 "$SERVER_HOST" > /tmp/host-keys 2>/dev/null
          matched=0
          while IFS= read -r key; do
            printf '%s\n' "$key" > /tmp/one-host-key
            fingerprint=$(ssh-keygen -lf /tmp/one-host-key | awk '{print $2}')
            if [ "$fingerprint" = 'SHA256:krCrd5JK0ES+IzHRuIdHDMqrsoEUsh2UWKz0tJ9YZ0Y' ]; then
              cat /tmp/one-host-key >> ~/.ssh/known_hosts
              matched=1
            fi
          done < /tmp/host-keys
          test "$matched" = 1 || { echo 'Audited VPS host identity mismatch'; exit 1; }
      - name: Inspect public education pages and application locations
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'deploy' }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes "${SERVER_USER}@${SERVER_HOST}" 'sudo -n python3 -' <<'PY'
          import urllib.request,json,subprocess,pathlib,re
          def notice(data):print('::notice title=Coonto brochure target::'+json.dumps(data,ensure_ascii=False))
          mounts=json.loads(subprocess.check_output(['docker','inspect','caddy_global'],text=True))[0]['Mounts']
          notice({'proxy_mounts':[{'src':m['Source'],'dst':m['Destination'],'rw':m.get('RW')} for m in mounts]})
          for f in ['/opt/coonto/prod/index.html']:
              data=subprocess.check_output(['docker','exec','caddy_global','cat',f],text=True)
              notice({'static_index':f,'html':data[:10000]})
          notice({'static_files':subprocess.check_output(['docker','exec','caddy_global','ls','-la','/opt/coonto/prod'],text=True)})
          for host in ['coonto.com','dev.coonto.com']:
              for path in ['/','/para-educadores','/api/health']:
                  try:
                      with urllib.request.urlopen('https://'+host+path,timeout=25) as r:
                          raw=r.read().decode();title=re.search(r'<title>(.*?)</title>',raw,re.S)
                          notice({'url':host+path,'status':r.status,'title':title.group(1) if title else '', 'educator': 'O papel do professor muda' in raw, 'next': '/_next/' in raw, 'redirect':r.url})
                  except Exception as e:notice({'url':host+path,'error':type(e).__name__})
          ps=subprocess.check_output(['docker','ps','--format','{{.Names}}'],text=True).splitlines()
          for name in ps:
              if name.startswith('coonto-') and '-app-' in name:
                  d=json.loads(subprocess.check_output(['docker','inspect',name],text=True))[0]
                  notice({'container':name,'workdir':d['Config'].get('WorkingDir'),'image':d['Config']['Image'],'compose_dir':d['Config'].get('Labels',{}).get('com.docker.compose.project.working_dir'),'mounts':[{'src':m['Source'],'dst':m['Destination']} for m in d['Mounts']]})
          cfg=json.loads(subprocess.check_output(['docker','exec','caddy_global','caddy','adapt','--config','/etc/caddy/Caddyfile'],text=True,stderr=subprocess.DEVNULL))
          def visit(x):
              if isinstance(x,dict):
                  hosts=[h for m in x.get('match',[]) for h in m.get('host',[])]
                  if 'coonto.com' in hosts or 'dev.coonto.com' in hosts:notice({'routing_hosts':hosts})
                  for v in x.values():visit(v)
              elif isinstance(x,list):
                  for v in x:visit(v)
          visit(cfg)
          for root in ['/opt/coonto/prod','/opt/coonto/dev']:
              p=pathlib.Path(root)
              if p.exists():
                  f=p/'app/para-educadores/page.tsx';notice({'source_root':root,'educator_source_exists':f.exists(),'package':json.loads((p/'package.json').read_text()).get('version') if (p/'package.json').exists() else '', 'educator_source_sha':__import__('hashlib').sha256(f.read_bytes()).hexdigest() if f.exists() else ''})
          PY
