name: Corporate Alpha validation
on:
  push:
    branches: [feature/alpha-visual-experience]
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check server.js
      - name: Start application and check endpoints
        run: |
          node server.js > /tmp/corporate-alpha.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for n in $(seq 1 15); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:3000/experience > /tmp/experience.html
          grep -q 'Uma ligação difícil' /tmp/experience.html
          grep -q 'const nodes=' /tmp/experience.html
