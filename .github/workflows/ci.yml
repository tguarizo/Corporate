name: Clean Alpha CI
on:
  push:
    branches: [rebuild/clean-alpha, feature/jornada-multimidia]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check server.js
