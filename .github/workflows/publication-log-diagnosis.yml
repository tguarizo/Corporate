name: Diagnose Alpha publication logs
on:
  push:
    branches: [feature/jornada-multimidia]
    paths: [.github/workflows/publication-log-diagnosis.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    outputs:
      codes: ${{ steps.log.outputs.codes }}
    steps:
      - name: Classify failed operations without exporting log contents
        id: log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 38496573100 --repo tguarizo/Corporate --log-failed > /tmp/private-run-log
          python3 - <<'PY'
          import os
          text=open('/tmp/private-run-log').read()
          import re
          lines=text.splitlines()
          candidates=[]
          for line in lines:
              for marker in ['locator.click:', 'page.goto:', 'page.waitForFunction:', 'browserType.launch:', 'Expected values to be strictly equal', 'NotSupportedError', 'The expression evaluated to a falsy value']:
                  if marker in line:
                      message=line[line.index(marker):]
                      candidates.append(message[:500])
          for line in lines:
              if 'waiting for ' in line and ('getByRole' in line or 'locator(' in line):
                  candidates.append(line[line.index('waiting for '):][:350])
          message=' | '.join(candidates[:6]) or 'No recognized browser error marker in the failed log.'
          print('::notice title=Public browser first-run diagnosis::'+message)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('codes=INSPECTED\n')
          PY
  result:
    needs: diagnose
    name: "Failure operation codes: ${{ needs.diagnose.outputs.codes }}"
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Only predefined operation codes were exported.'
