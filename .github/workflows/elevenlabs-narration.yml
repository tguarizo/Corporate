name: Generate ElevenLabs Alpha narration
on:
  push:
    branches: [feature/jornada-multimidia]
    paths: [.github/workflows/elevenlabs-narration.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      result: ${{ steps.generate.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify SSH configuration and audited host identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing SSH_PRIVATE_KEY'; exit 1; }
          test -n "$SERVER_HOST" || { echo 'Missing SERVER_HOST'; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 20 "$SERVER_HOST" > /tmp/host-keys 2>/dev/null
          matched=0
          while IFS= read -r key; do
            printf '%s\n' "$key" > /tmp/one-host-key
            fingerprint=$(ssh-keygen -lf /tmp/one-host-key | awk '{print $2}')
            if [ "$fingerprint" = 'SHA256:krCrd5JK0ES+IzHRuIdHDMqrsoEUsh2UWKz0tJ9YZ0Y' ]; then
              cat /tmp/one-host-key >> ~/.ssh/known_hosts
              matched=1
            fi
          done < /tmp/host-keys
          test "$matched" = 1 || { echo 'Audited VPS host identity mismatch'; exit 1; }
      - name: Generate narration using the existing secured binding
        id: generate
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'deploy' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_KEY }}
          ELEVEN_API: ${{ secrets.ELEVEN_API }}
          XI_API_KEY: ${{ secrets.XI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/elevenlabs-audio
          if [ -n "$ELEVENLABS_API_KEY$ELEVEN_API_KEY$ELEVENLABS_KEY$ELEVEN_API$XI_API_KEY" ]; then
            python3 .github/scripts/elevenlabs-narration.py /tmp/elevenlabs-audio > /tmp/narration-status
          else
            destination="${SERVER_USER}@${SERVER_HOST}"
            remote_dir=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$destination" 'mktemp -d /tmp/alpha-narration.XXXXXX')
            [[ "$remote_dir" =~ ^/tmp/alpha-narration\.[A-Za-z0-9]+$ ]]
            scp -o BatchMode=yes -o StrictHostKeyChecking=yes .github/scripts/elevenlabs-narration.py "$destination:$remote_dir/generate.py"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$destination" "sudo -n python3 '$remote_dir/generate.py' '$remote_dir/audio'" > /tmp/narration-status
            if grep -q '^RESULT=GENERATED$' /tmp/narration-status; then
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$destination" "sudo -n chmod -R a+rX '$remote_dir/audio'"
              scp -o BatchMode=yes -o StrictHostKeyChecking=yes "$destination:$remote_dir/audio/*" /tmp/elevenlabs-audio/
            fi
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$destination" "sudo -n rm -rf '$remote_dir'"
          fi
          result=$(sed -n 's/^RESULT=//p' /tmp/narration-status | tail -1)
          [[ "$result" =~ ^(GENERATED|KEY_NOT_FOUND|API_HTTP_[0-9]{3}|GENERATION_FAILED)$ ]]
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: elevenlabs-narration
          path: /tmp/elevenlabs-audio/*
          if-no-files-found: ignore
          retention-days: 3
  report:
    needs: narration
    name: "ElevenLabs: ${{ needs.narration.outputs.result }}"
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Credential values remain private; result is recorded in the job name.'
