name: Publish Coonto homepage and educator presentation
# Publish the approved institutional homepage on the existing static host.
on:
  push:
    branches: [feature/jornada-multimidia]
    paths:
      - .github/workflows/publish-coonto-presentation.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coonto-presentation-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify SSH configuration and audited host identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing SSH_PRIVATE_KEY'; exit 1; }
          test -n "$SERVER_HOST" || { echo 'Missing SERVER_HOST'; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 20 "$SERVER_HOST" > /tmp/host-keys 2>/dev/null
          matched=0
          while IFS= read -r key; do
            printf '%s\n' "$key" > /tmp/one-host-key
            fingerprint=$(ssh-keygen -lf /tmp/one-host-key | awk '{print $2}')
            if [ "$fingerprint" = 'SHA256:krCrd5JK0ES+IzHRuIdHDMqrsoEUsh2UWKz0tJ9YZ0Y' ]; then
              cat /tmp/one-host-key >> ~/.ssh/known_hosts
              matched=1
            fi
          done < /tmp/host-keys
          test "$matched" = 1 || { echo 'Audited VPS host identity mismatch'; exit 1; }
      - name: Publish the homepage, educator page and presentation
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'deploy' }}
        run: |
          set -euo pipefail
          tar -czf /tmp/coonto-presentation.tar.gz -C docs/coonto-educadores/site .
          destination="${SERVER_USER}@${SERVER_HOST}"
          remote_dir=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$destination" 'mktemp -d /tmp/coonto-education-presentation.XXXXXX')
          [[ "$remote_dir" =~ ^/tmp/coonto-education-presentation\.[A-Za-z0-9]+$ ]]
          scp -o StrictHostKeyChecking=yes /tmp/coonto-presentation.tar.gz "$destination:$remote_dir/site.tar.gz"
          scp -o StrictHostKeyChecking=yes .github/scripts/publish-education-brochure.py "$destination:$remote_dir/publish.py"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$destination" "sudo -n python3 '$remote_dir/publish.py' '$remote_dir/site.tar.gz'"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/coonto-presentation-browser --no-audit --no-fund --ignore-scripts playwright@1.58.2
      - name: Verify public page on desktop and mobile and download PDF
        env:
          NODE_PATH: /tmp/coonto-presentation-browser/node_modules
          PRESENTATION_BASE_URL: https://coonto.com
        run: node .github/scripts/education-presentation-browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: coonto-educadores-publicado
          path: /tmp/coonto-presentation-browser/*.png
          retention-days: 7
