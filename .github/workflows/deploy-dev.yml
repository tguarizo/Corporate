name: Deploy Coonto Corporate Dev to VPS

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to tuuvo.app.br
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          test -n "$SSH_PRIVATE_KEY" && test -n "$SERVER_HOST" || { echo "Deploy secrets missing"; exit 1; }
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Package and Deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'deploy' }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/coonto/corporate-dev' }}
        run: |
          mkdir -p /tmp/corporate-dev-pkg
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/corporate-dev-pkg/
          cd /tmp && tar -czf corporate-dev.tar.gz corporate-dev-pkg
          scp -o StrictHostKeyChecking=no /tmp/corporate-dev.tar.gz ${SERVER_USER}@${SERVER_HOST}:/tmp/corporate-dev.tar.gz
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "mkdir -p ${DEPLOY_PATH} && tar -xzf /tmp/corporate-dev.tar.gz -C ${DEPLOY_PATH} --strip-components=1 && rm -f /tmp/corporate-dev.tar.gz && cd ${DEPLOY_PATH} && chmod +x corporate.sh && ./corporate.sh install"

