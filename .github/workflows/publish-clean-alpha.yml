name: Publish clean Corporate Alpha
on:
  push:
    branches: [codex/alpha-publication-audit]
    paths:
      - .github/workflows/publish-clean-alpha.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corporate-alpha-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result: ${{ steps.deploy.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify SSH configuration and audited host identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing SSH_PRIVATE_KEY'; exit 1; }
          test -n "$SERVER_HOST" || { echo 'Missing SERVER_HOST'; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 20 "$SERVER_HOST" > /tmp/host-keys 2>/dev/null
          matched=0
          while IFS= read -r key; do
            printf '%s\n' "$key" > /tmp/one-host-key
            fingerprint=$(ssh-keygen -lf /tmp/one-host-key | awk '{print $2}')
            if [ "$fingerprint" = 'SHA256:krCrd5JK0ES+IzHRuIdHDMqrsoEUsh2UWKz0tJ9YZ0Y' ]; then
              cat /tmp/one-host-key >> ~/.ssh/known_hosts
              matched=1
            fi
          done < /tmp/host-keys
          test "$matched" = 1 || { echo 'Audited VPS host identity mismatch'; exit 1; }
      - name: Prepare the exact validated Alpha source
        run: |
          set -euo pipefail
          git archive 06cdfd11108b7ae9433e71e6833ae111871449e9 > /tmp/alpha.tar
          gzip /tmp/alpha.tar
      - name: Validate isolated publication and backup plan on VPS
        id: deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'deploy' }}
        run: |
          set -euo pipefail
          destination="${SERVER_USER}@${SERVER_HOST}"
          remote_dir=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$destination" 'mktemp -d /tmp/corporate-alpha-publish.XXXXXX')
          [[ "$remote_dir" =~ ^/tmp/corporate-alpha-publish\.[A-Za-z0-9]+$ ]]
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes /tmp/alpha.tar.gz "$destination:$remote_dir/source.tar.gz"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes .github/scripts/publish-alpha.py "$destination:$remote_dir/publish.py"
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$destination" "python3 '$remote_dir/publish.py' '$remote_dir/source.tar.gz' --preflight" > /tmp/publication-result 2>&1
          publication_status=$?
          set -e
          if [ "$publication_status" = 0 ]; then
            result=$(tail -n 1 /tmp/publication-result)
          else
            result=$(grep -E '(RuntimeError|PermissionError|FileNotFoundError|TypeError|SyntaxError):' /tmp/publication-result | tail -n 1 || true)
            result="FAILED: ${result:-publication command exited $publication_status}"
          fi
          printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"
          cat /tmp/publication-result
          exit "$publication_status"
  report:
    if: always()
    needs: publish
    name: "Alpha result: ${{ needs.publish.outputs.result }}"
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Publication result recorded; inspect preceding job for status.'
