name: coonto-corporate-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corporate_dev}
      POSTGRES_USER: ${POSTGRES_USER:-corporate_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - corporate_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corporate_app} -d ${POSTGRES_DB:-corporate_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - corporate_internal
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: coonto-corporate-dev:current
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-corporate_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-corporate_dev}
      PORT: 3000
    ports:
      - "127.0.0.1:3200:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - corporate_internal
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  corporate_postgres:
    name: corporate_postgres

networks:
  corporate_internal:
    name: corporate_internal
    driver: bridge
